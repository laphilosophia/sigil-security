name: Cross Runtime

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  cross-runtime:
    name: Core Smoke (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - node
          - bun
          - deno
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core package
        run: pnpm --filter @sigil-security/core run build

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Setup Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Node smoke
        if: matrix.runtime == 'node'
        run: node scripts/cross-runtime/core-smoke.mjs

      - name: Run Bun smoke
        if: matrix.runtime == 'bun'
        run: bun run scripts/cross-runtime/core-smoke.mjs

      - name: Run Deno smoke
        if: matrix.runtime == 'deno'
        run: deno run --allow-read scripts/cross-runtime/core-smoke.mjs
